<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер настрою</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Трекер настрою</h1>
    </header>

    <main>

        <section>
            <label for="mood"><h2>Відмітити настрій</h2></label>

            <select id="mood" name="mood">

                <option value="happy">Щасливий</option>

                <option value="good">Добрий</option>

                <option value="neutral">Нейтральний</option>

                <option value="sad">Сумний</option>

                <option value="angry">Злий</option>

    </select>
        </section>

        <section>
            <h2>Історія записів</h2>

            <article class="card">
                <h3>Запис настрою дата</h3>
            </article>
            
        </section>

    </main>

    <aside>
        <h2>Проста статистика</h2>
    </aside>

    <footer>
        <p>Трекер настрою - навчальний вебзастосунок для відстеження настрою та емоцій.</p>
        <p>2026</p>
    </footer>

    <script src="js/app.js"></script>

</body>

</html>
